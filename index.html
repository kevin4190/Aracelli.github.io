<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Cumpleaños Aracelli</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body class="inicio">

<div class="contenedor">
    <h1>🎉 Bienvenida señorita 🎉</h1>

    <button class="boton" onclick="irCumple()">
        🎂 Feliz Cumpleaños
    </button>
</div>

<!-- 🎵 Música -->
<audio id="musica" autoplay loop>
    <source src="musica/mirada.mp3" type="audio/mpeg">
</audio>

<script>
function irCumple() {
    window.location.href = "cumple.html";
}

/* 🎈 GLOBOS OPTIMIZADOS (RESPONSIVE) */
function crearGlobos() {
    const colores = ["#ff4d6d", "#ffcc00", "#4da6ff", "#4dff88", "#b84dff"];

    // menos globos en móvil para rendimiento
    const cantidad = window.innerWidth < 600 ? 10 : 20;

    for (let i = 0; i < cantidad; i++) {
        const globo = document.createElement("div");
        globo.classList.add("globo");

        globo.style.left = Math.random() * 100 + "vw";
        globo.style.backgroundColor = colores[Math.floor(Math.random() * colores.length)];
        globo.style.animationDuration = (Math.random() * 3 + 4) + "s";

        document.body.appendChild(globo);

        setTimeout(() => {
            globo.remove();
        }, 8000);
    }

    /* 🔁 ciclo infinito */
    setTimeout(crearGlobos, 7000);
}

/* 🚀 INICIO */
window.addEventListener("DOMContentLoaded", () => {
    const musica = document.getElementById("musica");

    if (musica) {
        musica.play().catch(() => {});
    }

    crearGlobos();
});
</script>

</body>
</html>
